<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Enroll Now</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
       

        .footer {
            background-color: rgb(239, 249, 255);
            width: 100%;
            color: darkblue;
            text-align: center;
            margin-top: 100px;
            padding: 15px;
            font-family: 'Gill Sans';
        }
        .contactform{
          
            display: block;
            margin: auto;
            width: 1300px;
            height: auto;
            box-shadow: 0px 3px 10px rgb(58, 75, 138);
            padding: 25px;
            font-family: 'Gill Sans';
            font-size: 17px;
            border-radius: 20px;
            opacity: 0.7;
        }    
        #fname, #mname, #lname{
            width: 400px;
        }
        
        #email, #number{
            width: 500px;
        }
        .my-button{
            background-color: rgb(62, 113, 255);
            color: rgb(252, 252, 252);
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            }
            h1{
                font-family: 'Gill Sans';
            }

        body{
            background-image: url('https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/d6c19b2c-898a-43fe-917b-2a73483e8904/PRIMARY+PROGRAM+5+-+SM2_3032.JPG?format=2500w'); 
            background-size: cover;
            background-repeat: no-repeat;
        }
      
        </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-light" id="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href=""><img src="https://files.orangeapps.ph/disk001/School_Files/1/school-66/school_profile/1724046763-1128.png" alt="logoob" class="rounded-circle" style="height:80px; width: 80px;"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mynavbar" style="font-family: 'Gill Sans';">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link text-primary" href="#enroll">Enroll Now</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="text" placeholder="Search">
                    <button class="btn btn-success" type="button">Search</button>
                </form>
            </div>
        </div>
    </nav>
     <div class="container">
                <div class="contactform mt-4 bg-light">
                    <h3 class="text-center">Student Information</h3>
                    <br><br>

                    <div class="form-group">
                        <div class="row">
                            <div class="col-md-4">
                                <label for="fname">Firstname</label>
                                <br>
                                <input type="text" id="fname" name="fname" placeholder="Francesca Rian" required>
                            </div>

                            <div class="col-md-4">
                                <label for="mname">Middle name</label>
                                <br>
                                <input type="text" id="mname" name="mname" placeholder="Roy" required>
                            </div>

                            <div class="col-md-4">
                                <label for="lname">Last name</label>
                                <br>
                                <input type="text" id="lname" name="lname" placeholder="Daquigan" required>
                            </div>

                        </div>    
                    </div>

                    <div class="form-group mt-3">
                        <div class="row">
                            <div class="col-md-3">
                                <label for="month">Birth month</label>
                                <br>
                                <select class="form-select" id="month" name="month" required>
                                    <option value="">Birth month</option>
                                    <option value="January">January</option>
                                    <option value="February">February</option>
                                    <option value="March">March</option>
                                    <option value="April">April</option>
                                    <option value="May">May</option>
                                    <option value="June">June</option>
                                    <option value="July">July</option>
                                    <option value="August">August</option>
                                    <option value="September">September</option>
                                    <option value="October">October</option>
                                    <option value="November">November</option>
                                    <option value="December">December</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="day">Birth day</label>
                                <br>
                                <select class="form-select" id="day" name="day" required>
                                    <option value="">Day</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                    <option value="16">16</option>
                                    <option value="17">17</option>
                                    <option value="18">18</option>
                                    <option value="19">19</option>
                                    <option value="20">20</option>
                                    <option value="21">21</option>
                                    <option value="22">22</option>
                                    <option value="23">23</option>
                                    <option value="24">24</option>
                                    <option value="25">25</option>
                                    <option value="26">26</option>
                                    <option value="27">27</option>
                                    <option value="28">28</option>
                                    <option value="29">29</option>
                                    <option value="30">30</option>
                                    <option value="31">31</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="yr">Birth year</label>
                                <br>
                                <select class="form-select" id="yr" name="yr" required>
                                    <option value="">Year</option>
                                    <option value="2008">2008</option>
                                    <option value="2009">2009</option>
                                    <option value="2010">2010</option>
                                    <option value="2010">2011</option>
                                    <option value="2010">2012</option>
                                    <option value="2010">2013</option>
                                    <option value="2010">2014</option>
                                    <option value="2010">2015</option>
                                    <option value="2010">2016</option>
                                    <option value="2010">2017</option>
                                    <option value="2010">2018</option>
                                    <option value="2010">2019</option>
                                    <option value="2020">2020</option>
                                    <option value="2020">2021</option>
                                    <option value="2020">2022</option>
                                    <option value="2020">2023</option>
                                    <option value="2020">2024</option>
                                    <option value="2020">2025</option>
                                    <option value="2020">2026</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="gender">Gender</label>
                                <br>
                                <select class="form-select" id="gender" name="gender" required>
                                    <option value="">Gender</option>
                                    <option value="m">Male</option>
                                    <option value="f">Female</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group mt-3">
                        <div class="row">
                            <div class="col-md-4">
                                <label for="level">Grade Level</label>
                                <br>
                                <select class="form-select" id="level" name="level" required>
                                    <option value="">Level</option>
                                    <option value="jc">Junior Casa</option>
                                    <option value="jac">Junior Advanced Casa</option>
                                    <option value="g1">Grade 1 (Primary)</option>
                                    <option value="g2">Grade 2 (Primary)</option>
                                    <option value="g3">Grade 3 (Primary)</option>
                                    <option value="g4">Grade 4 (Intermed)</option>
                                    <option value="g5">Grade 5 (Intermed)</option>
                                    <option value="g6">Grade 6 (Intermed)</option>
                                    <option value="g7">Grade 7 (JHS)</option>
                                    <option value="g8">Grade 8 (JHS)</option>
                                    <option value="g9">Grade 9 (JHS)</option>
                                    <option value="g10">Grade 10 (JHS)</option>
                                    <option value="g11">Grade 11 (SHS)</option>
                                    <option value="g12">Grade 12 (SHS)</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="sched">Schedule</label>
                                <br>
                                <select class="form-select" id="sched" name="sched" required>
                                    <option value="">Schedule</option>
                                    <option value="am">A.M.</option>
                                    <option value="pm">P.M.</option>
                                </select>
                            </div>
                                <div class="col-md-4">
                                <label for="mode">Mode</label>
                                <br>
                                <select class="form-select" id="mode" name="mode" required>
                                    <option value="">Mode</option>
                                    <option value="online">Online</option>
                                    <option value="hybrid">Hybrid</option>
                                    <option value="onsite">Onsite</option>
                                </select>
                            </div>    
                        </div>
                    </div>
                    <h3 class="text-center">Contact Information</h3>
                    <br><br>
                    <div class="form-group mt-3">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="email">Email</label>
                                <br>
                                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                                <br><br>
                            </div>

                            <div class="col-md-6">
                                <label for="number">Contact Number</label>
                                <br>
                                <input type="number" id="number" name="number" placeholder="09123456789" required>
                                <br><br>
                            </div>

                        </div>
                        <button class="my-button">Submit Application</button>
                        <br> 
                    </div>

</div>
</div>

<div class="space">
    <section class="footer" style="text-align: center;">
        <footer>
            ©2026 O.B. Montessori. All rights reserved. || Francesca Daquigan || 9-Topaz
        </footer>
    </section> 
    </div>
</body>
</html>
